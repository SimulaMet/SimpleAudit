# MkDocs configuration for SimpleAudit
# Generated by docs/generate_docs.py — safe to edit theme options,
# but the `nav` section is regenerated on each run.

site_name: SimpleAudit
site_description: Lightweight AI Safety Auditing Framework
site_url: https://sushantgautam.github.io/simpleaudit-docs/
repo_url: https://github.com/SushantGautam/simpleaudit
repo_name: SushantGautam/simpleaudit

docs_dir: site_src
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            paths: ["/Users/sushantgautam/copilot-worktrees/simpleaudit/sushantgautam-bookish-couscous"]
            docstring_style: numpy
            show_source: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - index.md
  - Guides:
    - Start Here:
      - guides/getting-started.md
      - guides/core-architecture.md
