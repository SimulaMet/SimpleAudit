about: Ask the community for help — setup, running audits, reading results, extending SimpleAudit
title: "[Q&A] "
labels: [question]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: e.g. run a RAG audit with local Llama 3, read fragility scores, add a custom judge
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try, and what happened?
      description: Include the exact command or code.
      render: shell
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output / error
      description: Paste the relevant output or error message.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - SimpleAudit version: `python -c "import simpleaudit; print(simpleaudit.__version__)"`
        - Python version:
        - Target type: (model / callable / HTTP app / decision model)
        - Judge/auditor model (if any):
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        *Check the [README quickstart](https://github.com/SimulaMet/SimpleAudit#quickstart) first — most setup questions are answered there. If this turns out to be a bug, please [open an issue](https://github.com/SimulaMet/SimpleAudit/issues) so we can track the fix.*
