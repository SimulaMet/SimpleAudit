# AutoDocs configuration
# This file drives generate_docs.py and upload_to_kb.py.
# The script is generic — all project-specific values live here.

# --- Project identity ---
# Used in LLM prompts and the index page.
# Full site identity (name, description, URLs) lives under `site:` below.
project_name: SimpleAudit

# --- Package discovery ---
# Name of the top-level Python package to document.
# The script walks <root>/<package_dir>/ for .py files.
package_dir: simpleaudit

# Root of the source repo. Default: parent of docs/ (i.e. the repo root).
# Override with the SOURCE_ROOT env var if needed.
# root: /absolute/path/to/repo

# --- LLM backend (Open WebUI) ---
llm:
  base_url: https://simulachat.sushant.info.np
  # API key is read from the OWUI_API_KEY env var (never commit it).
  kb_id: a43e450c-a197-4d53-95ca-555a6e6a2edb
  model: default

# --- Index page (deterministic, no LLM) ---
index:
  tagline: >
    Lightweight AI safety auditing: LLM judges score model outputs for
    safety, harm, factuality, and helpfulness across curated scenario packs.
    Results are aggregated, compared across models and judges, and
    visualized in the browser.
  quick_start:
    install: "pip install simpleaudit"
    example: |
      from simpleaudit import ModelAuditor, get_scenarios

      auditor = ModelAuditor(
          model="gpt-4o-mini",
          provider="openai",
          judge_model="gpt-4o",
          judge_provider="openai",
      )
      results = auditor.run(get_scenarios("safety"))
      results.summary()
    cli: |
      # Browse results in the browser
      simpleaudit serve --results_dir ./results

# --- Narrative guide sections (Layer 2, LLM-generated) ---
# Each entry: section title -> list of page slugs.
# Slugs must match the .md filenames in site_src/guides/.
narrative_sections:
  - title: Start Here
    slugs: [getting-started, core-architecture, cli-usage]
  - title: Judges
    slugs: [judges, judge-validation, cross-judge-validation]
  - title: Scenarios
    slugs: [scenarios]
  - title: Results & Tooling
    slugs: [results-analysis, visualization]
  - title: Advanced
    slugs: [reframing-advanced-workflows]

# --- API reference nav sections (Layer 1, Griffe-generated) ---
# Each entry: section title -> list of module prefixes.
# A module belongs to a section if it equals or starts with a prefix + ".".
reference_sections:
  - title: Core
    modules:
      - simpleaudit
      - simpleaudit.model_auditor
      - simpleaudit.results
      - simpleaudit.experiment
      - simpleaudit.repeated_results
      - simpleaudit.cross_judge
      - simpleaudit.reframing
      - simpleaudit.judge_the_judge
      - simpleaudit.cli
      - simpleaudit.utils
  - title: Judges
    modules:
      - simpleaudit.judges
  - title: Scenarios
    modules:
      - simpleaudit.scenarios
  - title: Visualization
    modules:
      - simpleaudit.visualization

